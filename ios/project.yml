name: PicantoOS
options:
  bundleIdPrefix: com.picantoos
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  PicantoOBDKit:
    path: PicantoOBDKit

targets:
  PicantoOSApp:
    type: application
    platform: iOS
    sources:
      - path: PicantoOSApp/Sources
    dependencies:
      - package: PicantoOBDKit
    info:
      path: PicantoOSApp/Info.plist
      properties:
        CFBundleDisplayName: PicantoOS
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Required to connect to the Vgate iCar Pro 2S OBD-II adapter over Bluetooth Low Energy."
        UIBackgroundModes:
          - audio
          - bluetooth-central
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picantoos.app
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
